# tmux: a server holds sessions, a session holds windows (full-screen tabs), a
# window holds panes (splits). The server outlives the terminal: `tmux attach`
# picks up where a closed one left off. `set -g` sets a global (default) option,
# `set -s` a server option, `setw`/`set -w` a window option; `bind` adds a key
# after the prefix, `bind -n` one without it, `bind -T <table>` one in a mode.
# `tmux list-keys` and `tmux show -g` list the defaults this changes.

# Prefix: ctrl+space (ctrl+b is Claude Code's "background task")
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal
set -g default-terminal "tmux-256color"
# terminal-features is a list: a fixed index, not -a, so reloading (prefix+r)
# overwrites the entry instead of adding another copy each time.
set -s terminal-features[10] "foot:RGB"
set -s extended-keys on
set -s terminal-features[11] "foot:extkeys"
set -s escape-time 0
# Focus reports from the terminal: Neovim's autoread, and the pane-focus-in
# hook below.
set -g focus-events on
set -g history-limit 50000
set -g mouse off

# Numbering from 0, tmux's default; no gaps after a window closes. Scripts find
# windows by tag, never by number.
set -g renumber-windows on

# Vi everywhere. Copying goes to the terminal (OSC 52), which puts it on the
# system clipboard: no wl-copy.
set -g mode-keys vi
set -g status-keys vi
set -s set-clipboard on
set -s terminal-features[12] "foot:clipboard"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind Escape copy-mode

# Panes: alt+hjkl without prefix, prefix+hjkl too, HJKL to resize (-r: repeats
# without the prefix for a moment).
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# tmux's own keys for splits (% beside, " below) and windows (c), kept, but in
# the current directory rather than the one the session started in.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window

# The focused pane: a heavy border, bright where it touches that pane, with
# arrows pointing at it; other borders grey. tmux only draws borders between
# panes, so a window with one pane has none. Text in the other panes is dimmed
# (window-style), the focused one keeps the terminal's colours
# (window-active-style: "terminal", since "default" would fall back to
# window-style's grey); a program's own colours stay as they are.
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=brightblue"
set -g window-style "fg=colour245"
set -g window-active-style "fg=terminal"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ── Agent sessions (tt, in ~/.local/bin) ──
# A session per repo: "orch" (Claude in the main checkout) and a window per
# task. #{…} is a format: tmux fills it in for the pane, window or session at
# hand; #{@name} reads a user option, which tt and the agent hooks set.

# Popups (display-popup) run a command over the current window; -E closes it
# when the command ends, -d starts it in the pane's directory. On failure it
# stays open until enter, so the error can be read.
bind t display-popup -E -T " new task " -w 60 -h 6 -d "#{pane_current_path}" "tt new || read -r _"
bind X display-popup -E -T " archive tasks (branches stay) " -w 90% -h 50% -d "#{pane_current_path}" "tt archive || read -r _"
bind T display-popup -E -T " restore task " -w 80% -h 50% -d "#{pane_current_path}" "tt restore || read -r _"
# prefix+f: every session, window and pane in a list that filters as you type,
# with each window's role, agent state and conversation title (tmux's own f
# finds a window by exact text). Its kills are safe, unlike x in tmux's tree
# (prefix+s, left as tmux has it) on the tree's own session.
bind f display-popup -E -T " find " -w 90% -h 80% "tt pick"

# prefix+o: the session's next orchestrator window (tmux's own o, next pane,
# is prefix+hjkl here); prefix+O: a new one, for research or a separate
# thread. run-shell fills in formats before running the command, and shows
# its output over the pane, so O drops the new pane id tt prints for scripts
# (errors still show).
bind o run-shell "tt orch '#{session_id}' '#{window_id}'"
bind O run-shell "tt orch new '#{pane_current_path}' '#{client_name}' >/dev/null"

# Killing a window (&) asks first, louder for an orchestrator.
bind & if -F "#{==:#{@role},orchestrator}" \
    "confirm-before -p 'Kill the orchestrator? (y/n)' kill-window" \
    "confirm-before -p 'kill-window #W? (y/n)' kill-window"

# A pane that gets focus has been seen: its done agent's ✓ dims, and open
# pickers reload to show it. Hooks run tmux commands
# on events.
set-hook -g pane-focus-in "set -p @agent_seen 1 ; if -F '#{@agent_state}' 'run-shell -b \"tt _notify\"'"

# Status line: window names cut to 24 characters (task windows are named after
# the branch); on the right, agents waiting on you (⚠) and finished ones not
# seen yet (✓). #() runs a command, refreshed every status-interval seconds.
set -g status-interval 5
setw -g window-status-format " #I:#{=24:window_name}#F "
setw -g window-status-current-format " #I:#{=24:window_name}#F "
set -g status-right "#(tt count)%H:%M "

# Killing the session a terminal shows moves that terminal to another session
# instead of disconnecting it. (The server still quits with its last session:
# exit-empty.)
set -g detach-on-destroy off

# A server starting up (after a reboot or a kill-server) reopens what was open:
# tt up resumes each agent window's conversation. -b runs it in the background;
# reloading this file runs it again, which reopens only what's missing.
run-shell -b "tt up"

# ── Plugins (TPM; prefix+I installs, prefix+U updates) ──
# In ~/.local/share, not TPM's default ~/.config/tmux/plugins: that directory
# is a stow symlink into the repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
# prefix+e: pick a word, path, URL or line from the pane with fzf; enter copies
# it, tab inserts it at the prompt. Its default key, Tab, is tmux's own
# floating pane.
set -g @plugin "laktak/extrakto"
set -g @extrakto_key e
# Copies like copy mode: OSC 52, not wl-copy.
set -g @extrakto_clip_mode tmux_osc52
# TPM goes last: it reads the @plugin lines above.
run-shell "~/.local/share/tmux/plugins/tpm/tpm"
