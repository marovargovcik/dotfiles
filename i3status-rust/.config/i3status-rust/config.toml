[theme]
theme = "gruvbox-dark"

[icons]
icons = "material-nf"

# Polling policy: nothing forks on a timer faster than once a minute. Blocks
# that can react to events do (udev signal, D-Bus, netlink, inotify); the
# intervals that remain are safety nets. Signal numbers in use: 8 USB (udev)
# — see README §11.

[[block]]
block = "custom"
command = "usb-status"
json = true
hide_when_empty = true
interval = 300
signal = 8
format = " $text "

[[block.click]]
button = "left"
cmd = "usb-menu"

[[block]]
block = "custom"
command = "bt-status"
persistent = true
format = " $text "

[[block.click]]
button = "left"
cmd = "foot bluetui"

[[block]]
block = "net"
format = " $icon {$ssid|$device} "
inactive_format = " $icon -- "
interval = 5

[[block.click]]
button = "left"
cmd = "foot impala"

[[block]]
block = "custom"
command = "wg-status"
persistent = true
format = " $text "

[[block.click]]
button = "left"
cmd = "wg-menu"

[[block]]
block = "battery"
device = "BAT0"
format = " $icon $percentage "
full_format = " $icon $percentage "
interval = 30

# Native block: inotify on sysfs, no interval to set. Scroll changes brightness.
[[block]]
block = "backlight"
device = "intel_backlight"
format = " $icon $brightness "

# No keyboard-backlight block: reading that LED is an ACPI call and nothing
# signals its changes, so showing it means polling. The lit keys are the
# indicator.

[[block]]
block = "keyboard_layout"
driver = "sway"
format = "$layout"
[block.mappings]
"English (US)" = "US"
"Slovak (QWERTY)" = "SK"

[[block]]
block = "sound"
driver = "pulseaudio"
format = "$icon {$volume.eng(w:2)|—}"
max_vol = 100

[[block.click]]
button = "left"
cmd = "foot wiremix"

[[block]]
block = "custom"
command = "echo '󰌾'"
interval = "once"
format = " $text "

[[block.click]]
button = "left"
cmd = "1password --toggle"

[[block]]
block = "time"
format = " $timestamp.datetime(f:'%d %b %Y %H:%M') "
interval = 60

[[block]]
block = "custom"
command = "echo '󰐥'"
interval = "once"
format = " $text "

[[block.click]]
button = "left"
cmd = "power-menu"
