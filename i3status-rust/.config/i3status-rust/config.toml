[theme]
theme = "gruvbox-dark"

[icons]
icons = "material-nf"

[[block]]
block = "custom"
command = "usb-status"
json = true
hide_when_empty = true
interval = 30
signal = 8
format = " $text "

[[block.click]]
button = "left"
cmd = "usb-menu"

[[block]]
block = "custom"
command = "bt-status"
interval = 3
format = " $text "

[[block.click]]
button = "left"
cmd = "foot bluetui"

[[block]]
block = "net"
format = " $icon {$ssid|$device} "
inactive_format = " $icon -- "
interval = 5

[[block.click]]
button = "left"
cmd = "foot impala"

[[block]]
block = "custom"
command = "wg-status"
interval = 5
format = " $text "

[[block.click]]
button = "left"
cmd = "wg-menu"

[[block]]
block = "battery"
device = "BAT0"
format = " $icon $percentage "
full_format = " $icon $percentage "
interval = 30

[[block]]
block = "custom"
command = "scr=$(cat /sys/class/backlight/intel_backlight/brightness); max=$(cat /sys/class/backlight/intel_backlight/max_brightness); kbd=$(cat /sys/class/leds/tpacpi::kbd_backlight/brightness); case $kbd in 0) kbdl=off;; 1) kbdl=low;; 2) kbdl=high;; esac; printf '󰃟 %d%%  󰌌 %s' $((scr*100/max)) $kbdl"
interval = 1
format = " $text "

[[block]]
block = "keyboard_layout"
driver = "sway"
format = "$layout"
[block.mappings]
"English (US)" = "US"
"Slovak (QWERTY)" = "SK"

[[block]]
block = "sound"
driver = "pulseaudio"
format = "$icon {$volume.eng(w:2)|—}"
max_vol = 100

[[block.click]]
button = "left"
cmd = "foot wiremix"

[[block]]
block = "custom"
command = "echo '󰌾'"
interval = "once"
format = " $text "

[[block.click]]
button = "left"
cmd = "1password --toggle"

[[block]]
block = "time"
format = " $timestamp.datetime(f:'%d %b %Y %H:%M') "
interval = 60

[[block]]
block = "custom"
command = "echo '󰐥'"
interval = "once"
format = " $text "

[[block.click]]
button = "left"
cmd = "power-menu"
