onboarding = false

[keys]
prefix = "ctrl+space"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# herdr-task (herdr package's ~/.local/bin/herdr-task) in place of herdr's own
# worktree keys: new starts claude, archive picks tasks from every repo and logs
# them so restore can bring them back.
# On failure the popup stays open until enter, so the error can be read.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr-task new || read -r _"
description = "new task: worktree + claude"
width = 60
height = 6

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "herdr-task archive || read -r _"
description = "archive tasks (branches stay)"
width = "90%"
height = "50%"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "herdr-task restore || read -r _"
description = "restore archived task"
width = "80%"
height = "50%"

[ui]
# sidebar as an attention queue: blocked/done agents float to the top
agent_panel_sort = "priority"
status_indicators = "symbols"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# desktop notification when a background agent finishes or needs input;
# prefix+o jumps to it
[ui.toast]
delivery = "system"
