# /etc/resolvconf.conf — openresolv configuration.
#
# NOTE: on the old machine this setting was written to /etc/resolvconf.conF
# (capital F) and was therefore inert; resolv.conf kept using the router's
# DNS. The line is restored here under the correct filename.
resolv_conf=/etc/resolv.conf

# Cloudflare DNS. Remove this line to fall back to DHCP-provided servers.
name_servers="1.1.1.1 1.0.0.1"
